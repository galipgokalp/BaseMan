    <link rel="apple-touch-icon-precomposed" href="icon/ios_icon.png"/>
    <link rel="icon" type="image/png" href="icon/favicon.png"/>
    <!-- ======= EMBED META TAG ======= -->
    <meta
      name="fc:miniapp"
      content='{"version":"1","imageUrl":"https://base-man.vercel.app/shots/embed_1800x1200.png","button":{"title":"Play Now","action":{"type":"launch_miniapp","name":"BaseMan","url":"https://base-man.vercel.app/","splashImageUrl":"https://base-man.vercel.app/splash.png","splashBackgroundColor":"#141416"}}}'

      name="fc:frame"

    <link rel="stylesheet" href="styles/main.css" />

    <script src="pacman.js"></script>

<body>
    <div class="font-preload"></div>
    <div id="game-shell" class="game-shell">
      <canvas id='canvas'><div id="canvas-warning">Your browser does not support HTML Canvas.  Please upgrade!</div></canvas>
      <section id="leaderboard-panel" class="leaderboard-panel" data-limit="100">
        <header class="leaderboard-header">
          <span class="leaderboard-title">PAC-BOARD</span>
          <button type="button" class="leaderboard-refresh" data-refresh>Refresh</button>
        </header>
        <div class="leaderboard-status" data-status>Loading leaderboard…</div>
        <ol class="leaderboard-list leaderboard-list-top" data-list-top></ol>
        <div class="leaderboard-scroll" data-scroll-wrapper>
          <ol class="leaderboard-list leaderboard-list-rest" data-list-rest></ol>
        </div>
      </section>
    </div>
    <canvas id='atlas' class="atlas-hidden"></canvas>
    <script defer src="vendor/miniapp-sdk/index.min.js"></script>
    <script defer src="vendor/ethers/ethers.umd.min.js"></script>
    <script defer src="src/onchain-config.js?v=20251028b"></script>
    <script defer src="src/onchain-bootstrap.js?v=20251028b"></script>
    <script defer src="src/onchain-client.js?v=20251028b"></script>
    <script defer src="src/leaderboard-panel.js?v=20251028b"></script>
    <!-- Minimal fallback wallet button for miniapps -->
    <button id="wallet-fallback-btn" class="wallet-fallback-btn">Connect Wallet</button>
    <script defer src="src/wallet-fallback.js"></script>
    <!-- OnchainKit React island mount point + bundle -->
    <div id="onchainkit-root"></div>
    <!-- Inject NEXT_PUBLIC_* vars at runtime for the bundle (works in dev and prod) -->
    <script defer src="/api/env.js?v=20251028b"></script>
    <!-- Load OnchainKit bundle only in web (not inside mini-app containers) -->
    <script defer src="src/load-onchainkit.js?v=20251028b"></script>
  </body>
</html>
