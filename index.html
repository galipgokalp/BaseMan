<head>

    <script src="pacman.js"></script>
</head>
<body>
    <div class="font-preload"></div>
    <div id="game-shell" class="game-shell">
      <div class="canvas-container">
        <canvas id='canvas'><div id="canvas-warning">Your browser does not support HTML Canvas.  Please upgrade!</div></canvas>
      </div>
      <section id="leaderboard-panel" class="leaderboard-panel" data-limit="100" hidden>
        <button type="button" class="leaderboard-close" data-close>×</button>
        <header class="leaderboard-header">
          <span class="leaderboard-title">PAC-BOARD</span>
          <button type="button" class="leaderboard-refresh" data-refresh>Refresh</button>
        </header>
        <div class="leaderboard-body">
          <div class="leaderboard-status" data-status>Loading leaderboard…</div>
          <ol class="leaderboard-list leaderboard-list-top" data-list-top></ol>
          <div class="leaderboard-scroll" data-scroll-wrapper>
            <ol class="leaderboard-list leaderboard-list-rest" data-list-rest></ol>
          </div>
        </div>
      </section>
    </div>
    <!-- Bottom Navigation Bar -->
    <nav id="bottom-nav" class="bottom-nav" role="navigation" aria-label="Main navigation">
      <button type="button" class="nav-item" data-nav="leaderboard" aria-label="Leaderboard">
        <span class="nav-icon">🏆</span>
        <span class="nav-label">PAC-BOARD</span>
      </button>
      <button type="button" class="nav-item" data-nav="profile" aria-label="Profile">
        <span class="nav-icon">👤</span>
        <span class="nav-label" style="display: none;">Pro</span>
      </button>
      <button type="button" class="nav-item" data-nav="wallet" aria-label="Wallet">
        <span class="nav-icon nav-icon-wallet">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 5H3C1.89543 5 1 5.89543 1 7V17C1 18.1046 1.89543 19 3 19H21C22.1046 19 23 18.1046 23 17V7C23 5.89543 22.1046 5 21 5Z" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M1 9H23" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
            <path d="M17 13C17.5523 13 18 12.5523 18 12C18 11.4477 17.5523 11 17 11C16.4477 11 16 11.4477 16 12C16 12.5523 16.4477 13 17 13Z" fill="#3B82F6"/>
          </svg>
        </span>
        <span class="nav-label">WALLET</span>
      </button>
      <button type="button" class="nav-item" data-nav="settings" aria-label="Settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">SETTINGS</span>
      </button>
    </nav>
    <canvas id='atlas' class="atlas-hidden"></canvas>
    <script defer src="vendor/miniapp-sdk/index.min.js"></script>
    <!-- Centralized platform detection utility (must load early) -->
    <script type="module" src="src/utils/platform-detection.js"></script>
    <!-- Unified SDK detection utility (depends on platform-detection) -->
    <script type="module" src="src/utils/sdk-detection.js"></script>
    <!-- Expose Mini App EIP-1193 provider as window.ethereum for libs expecting injected provider -->
    <script defer src="src/miniapp-ethereum-shim.js"></script>
    <!-- Debug/mock: inject a minimal Mini App SDK + provider in web for local e2e -->
    <script defer src="src/mock-miniapp-provider.js"></script>
    <script defer src="src/miniapp-auth.js"></script>
    <script defer src="vendor/ethers/ethers.umd.min.js"></script>
    <!-- Inject NEXT_PUBLIC_* and safe runtime keys early -->
    <script defer src="/api/env.js?v=202512061200"></script>
    <!-- Base on-chain defaults (generated) -->
    <script defer src="src/onchain-config.js?v=202512061200"></script>
    <!-- Override on-chain config from runtime env (chainId, registry, urls) -->
    <script defer src="src/runtime-config-override.js?v=202512061200"></script>
    <script defer src="src/onchain-bootstrap.js?v=202512061200"></script>
    <script defer src="src/onchain-client.js?v=202512061200"></script>
    <!-- React/Wagmi Connect widget (bundled) -->
    <script defer src="vendor/connect-menu.js"></script>
    <!-- Optional auto submit for e2e: set ?mock-miniapp=1&auto=1 to trigger a score submission -->
    <script defer src="src/debug-autosubmit.js"></script>
    <script defer src="src/leaderboard-panel.js?v=202512061200"></script>
    <!-- Profile panel (in‑app) -->
    <script defer src="src/profile-panel.js"></script>
    <!-- Wallet panel -->
    <script defer src="src/wallet-panel.js"></script>
    <!-- Settings panel -->
    <script defer src="src/settings-panel.js"></script>
    <!-- Bottom navigation bar -->
    <script defer src="src/bottom-nav.js"></script>
    <!-- Console logger (captures all console logs and errors) -->
    <script defer src="src/console-logger.js"></script>
    <!-- __env already loaded above -->
  </body>
</html>
